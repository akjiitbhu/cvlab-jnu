# Nginx reverse proxy for the lab website, reached by IP address.
#
#   sudo cp deploy/nginx-cvlab.conf /etc/nginx/sites-available/cvlab
#   sudo ln -s /etc/nginx/sites-available/cvlab /etc/nginx/sites-enabled/cvlab
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why nginx at all, when Node can listen on 80 itself? Binding port 80 needs
# root or a capability grant, and you do not want the app running as root.
# Nginx also serves the static files without waking Node, terminates TLS when
# you eventually have a certificate, and survives an app restart by returning a
# clean 502 instead of a refused connection.

upstream cvlab_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;

    # IPv6. Left commented out because it is the one line that can stop nginx
    # from starting at all: on a server with IPv6 disabled, nginx -t fails with
    #     [emerg] socket() [::]:80 failed (97: Address family not supported)
    # and refuses the whole configuration, not just this line.
    # Check with:  ip -6 addr show
    # If you have a global IPv6 address, uncomment this to serve over IPv6 too.
    #listen [::]:80 default_server;

    # default_server plus "_" means: answer on any hostname, which is what you
    # want while the site is reached by raw IP. When you get a domain, replace
    # this with  server_name lab.example.ac.in;  and let certbot edit the file.
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    # Upload cap. The app itself caps JSON bodies at 256 kB; this stops a large
    # body from even reaching Node.
    client_max_body_size 2m;

    access_log /var/log/nginx/cvlab.access.log;
    error_log  /var/log/nginx/cvlab.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- static files, straight from disk ---------------------------------
    # Nginx reads these itself, so Node is not involved in serving CSS, JS or
    # course PDFs. Note there is no /admin location here: the editor is an HTML
    # file served by Node, which keeps it on one origin with the API.

    location /assets/ {
        alias /srv/cvlab/docs/assets/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri @app;
    }

    location /files/ {
        alias /srv/cvlab/docs/files/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ---- everything else goes to the app ----------------------------------

    location / {
        proxy_pass http://cvlab_app;
        proxy_http_version 1.1;

        # The app trusts one proxy hop (app.set('trust proxy', 1)) and reads the
        # client IP from X-Forwarded-For. Without these headers the login rate
        # limiter sees every request as coming from 127.0.0.1, and one attacker
        # exhausts the limit for everybody.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter appends to
        # whatever the client sent, leaving "1.2.3.4, <real ip>" when a visitor
        # sets their own X-Forwarded-For.
        #
        # With app.set('trust proxy', 1) that is still safe — Express takes the
        # last entry, which nginx wrote — and it was measured, not assumed:
        #     trust proxy = 1     appended XFF -> req.ip = <real ip>   safe
        #     trust proxy = 2     appended XFF -> req.ip = 1.2.3.4     spoofed
        #     trust proxy = true  appended XFF -> req.ip = 1.2.3.4     spoofed
        #
        # Overwriting is defence in depth: it keeps attacker-controlled data out
        # of the header entirely, so raising the trust setting later — adding a
        # CDN, putting this behind another proxy — cannot quietly turn the login
        # rate limiter into something an attacker can rotate around. There is
        # exactly one proxy here, so the client's own header carries no
        # information worth keeping.
        #
        # If you ever DO add a second proxy in front of nginx, change this back
        # to $proxy_add_x_forwarded_for AND set trust proxy to match the real
        # number of hops.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
    }

    location @app {
        proxy_pass http://cvlab_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check, handy for monitoring and kept out of the access log.
    location = /api/health {
        proxy_pass http://cvlab_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
